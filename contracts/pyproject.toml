[project]
name = "shadeway-contracts"
version = "0.0.1"
description = "shadeway frozen interfaces: table schemas, api models, fixtures"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=16",
    "pydantic>=2.7",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadeway_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
