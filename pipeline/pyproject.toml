[project]
name = "shadeway-pipeline"
version = "0.0.1"
description = "shadeway offline pipeline (scene + graph builder)"
requires-python = ">=3.11"
dependencies = [
    "shadeway-contracts",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16",
    "rasterio>=1.3",
    "scipy>=1.11",
    "affine>=2.4",
    "requests>=2.32",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadeway_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
