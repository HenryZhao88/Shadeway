[project]
name = "shadeway-server"
version = "0.0.1"
description = "shadeway api server (fastapi)"
requires-python = ">=3.11"
dependencies = [
    "shadeway-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "shapely>=2.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadeway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
